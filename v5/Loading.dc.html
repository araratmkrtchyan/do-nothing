<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Do Nothing — Loading</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="offline/fit.css">
<script src="offline/fit.js"></script>
<script src="offline/resources.js"></script>
<script src="offline/support.js"></script>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@keyframes dnDot{0%,100%{transform:scale(0.78)}50%{transform:scale(1)}}
@keyframes dnWave{0%{transform:scale(1);opacity:0.6}100%{transform:scale(1.9);opacity:0}}
@keyframes dnWord{0%{opacity:0}100%{opacity:1}}
.dn-dot{animation:dnDot 2.4s ease-in-out infinite}
.dn-wave{animation:dnWave 2.4s ease-out infinite}
.dn-word{animation:dnWord 0.9s ease-out 0.3s both}
@media (prefers-reduced-motion: reduce){.dn-dot,.dn-wave{animation:none}.dn-word{animation:dnWord 0.9s ease-out both}}
</style>
</helmet>
<div class="dn" data-mode="{{mode}}" data-accent="{{accent}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--background-primary); color: var(--text-primary); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px">
<div role="img" aria-label="Do Nothing" style="position: relative; width: 104px; height: 104px; display: flex; align-items: center; justify-content: center">
<div aria-hidden="true" style="position: absolute; inset: 0; border-radius: 9999px; border: 2px solid var(--accent); opacity: 0.4"></div>
<div aria-hidden="true" class="dn-wave" style="position: absolute; inset: 0; border-radius: 9999px; border: 2px solid var(--accent)"></div>
<div aria-hidden="true" class="dn-dot" style="width: 52px; height: 52px; border-radius: 9999px; background: var(--accent)"></div>
</div>
<div class="dn-word" style="font-size: 22px; line-height: 28px; font-weight: 600">Do Nothing</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"accent":{"editor":"enum","options":["orange","teal","lavender","rose"],"default":"orange"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { mode: (this.props.dark ?? true) ? 'dark' : 'light', accent: this.props.accent || 'orange' };
}
}
</script>
</body>
</html>
