<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Do Nothing — Widgets</title>
<script src="offline/resources.js"></script>
<script src="offline/support.js"></script>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="dn" lang="{{lang}}" data-mode="{{mode}}" data-accent="{{accent}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--background-primary); color: var(--text-primary); display: flex; flex-direction: column; padding: 56px 20px 40px 20px">
<div lang="en" style="padding: 0 4px 12px 4px; font-size: 13px; line-height: 18px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-secondary)">Home Screen · ready, running</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<a href="{{sessionHref}}" aria-label="{{t.startA11y}}" style="height: 160px; box-sizing: border-box; border-radius: 22px; background: var(--background-secondary); padding: 16px; display: flex; flex-direction: column; text-decoration: none; color: var(--text-primary)">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" style="fill: var(--accent)"><path d="M13.5 2L4 13.5h6.5L9.5 22 20 9.5h-6.5L13.5 2z"></path></svg>
<span style="margin-top: 12px; font-size: 13px; line-height: 18px; color: var(--text-secondary)">{{t.ready}}</span>
<span style="flex-grow: 1"></span>
<span style="align-self: flex-start; padding: 4px 16px; border-radius: 9999px; background: var(--accent); color: var(--on-accent); font-size: 15px; line-height: 20px; font-weight: 600">{{t.cta}}</span>
</a>
<div style="height: 160px; box-sizing: border-box; border-radius: 22px; background: var(--background-secondary); padding: 16px; display: flex; flex-direction: column">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: var(--text-secondary)"><span aria-hidden="true" style="width: 12px; height: 12px; flex-shrink: 0; border-radius: 9999px; background: var(--accent)"></span>{{t.coffee}}</span>
<span style="flex-grow: 1"></span>
<span role="timer" style="font-size: 34px; line-height: 1; font-weight: 300; font-variant-numeric: tabular-nums">12:40</span>
<span style="margin-top: 4px; font-size: 13px; line-height: 18px; color: var(--text-secondary)">{{t.leftEnds}}</span>
<span aria-hidden="true" style="margin-top: 12px; height: 4px; border-radius: 9999px; background: var(--fill); display: flex"><span style="width: 16%; border-radius: 9999px; background: var(--accent)"></span></span>
</div>
</div>
<div lang="en" style="padding: 24px 4px 12px 4px; font-size: 13px; line-height: 18px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-secondary)">Home Screen · done, paused</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<a href="{{endHref}}" aria-label="{{t.doneA11y}}" style="height: 160px; box-sizing: border-box; border-radius: 22px; background: var(--background-secondary); padding: 16px; display: flex; flex-direction: column; text-decoration: none; color: var(--text-primary)">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 9999px; background: var(--accent); display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--on-accent)"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
<span style="flex-grow: 1"></span>
<span style="font-size: 22px; line-height: 28px; font-weight: 600">{{t.done}}</span>
<span style="margin-top: 4px; font-size: 13px; line-height: 18px; color: var(--text-secondary)">{{t.line}}</span>
</a>
<div style="height: 160px; box-sizing: border-box; border-radius: 22px; background: var(--background-secondary); padding: 16px; display: flex; flex-direction: column">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: var(--text-secondary)">
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"></rect><rect x="14" y="4" width="5" height="16" rx="1.5"></rect></svg>{{t.paused}}</span>
<span style="flex-grow: 1"></span>
<span style="font-size: 34px; line-height: 1; font-weight: 300; color: var(--text-secondary); font-variant-numeric: tabular-nums">12:40</span>
<span style="margin-top: 4px; font-size: 13px; line-height: 18px; color: var(--text-secondary)">{{t.openResume}}</span>
<span aria-hidden="true" style="margin-top: 12px; height: 4px; border-radius: 9999px; background: var(--fill); display: flex"><span style="width: 16%; border-radius: 9999px; background: var(--text-tertiary)"></span></span>
</div>
</div>
<div lang="en" style="padding: 24px 4px 12px 4px; font-size: 13px; line-height: 18px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-secondary)">Lock Screen · running</div>
<div style="display: flex; gap: 16px; align-items: center">
<div style="width: 172px; height: 76px; box-sizing: border-box; border-radius: 16px; background: var(--background-tertiary); padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; gap: 2px">
<span style="font-size: 13px; line-height: 18px; font-weight: 600">{{t.coffeeShort}}</span>
<span style="font-size: 20px; line-height: 25px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap">{{t.timeLeft}}</span>
<span aria-hidden="true" style="margin-top: 4px; height: 4px; border-radius: 9999px; background: var(--fill); display: flex"><span style="width: 16%; border-radius: 9999px; background: var(--text-primary)"></span></span>
</div>
<div role="img" aria-label="{{t.ringA11y}}" style="width: 76px; height: 76px; border-radius: 9999px; background: var(--background-tertiary); position: relative; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="64" height="64" viewBox="0 0 64 64" style="position: absolute; transform: rotate(-90deg)"><circle cx="32" cy="32" r="28" fill="none" stroke-width="4" style="stroke: var(--fill)"></circle><circle cx="32" cy="32" r="28" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="148" style="stroke: var(--text-primary)"></circle></svg>
<span style="display: flex; flex-direction: column; align-items: center; line-height: 1"><span style="font-size: 20px; font-weight: 600">13</span><span style="font-size: 13px">{{t.unit}}</span></span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"lang":{"editor":"enum","options":["en","hy","ru"],"default":"en"},"accent":{"editor":"enum","options":["orange","teal","lavender","rose"],"default":"orange"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

dnMin(n){ const L = this.props.lang || 'en'; let f = n === 1 ? 'one' : 'many'; try { const c = new Intl.PluralRules(L).select(n); f = c === 'one' ? 'one' : (c === 'few' ? 'few' : 'many'); } catch (e) {} return this.dnT('unit_minute_' + f, { n: n }); }
renderVals() {
const dark = this.props.dark ?? true;
const T = (k, v) => this.dnT(k, v);
const line = T('notif_coffee');
return {
lang: this.props.lang || 'en',
mode: dark ? 'dark' : 'light',
accent: this.props.accent || 'orange',
t: { startA11y: T('w_start_a11y'), ready: T('purpose_coffee') + ' · ' + T('unit_min_chip', { n: 15 }), cta: T('start_cta'), coffee: T('purpose_coffee'), leftEnds: T('w_left_ends', { time: '19:30' }), doneA11y: T('w_done_a11y', { line }), done: T('w_done'), line, paused: T('w_paused'), openResume: T('w_open_resume'), coffeeShort: T('purpose_coffee_short'), timeLeft: T('w_time_left', { time: '12:40' }), ringA11y: T('w_ring_a11y'), unit: T('unit_min') },
sessionHref: dark ? 'Session.dc.html' : 'SessionLight.dc.html',
endHref: dark ? 'End.dc.html' : 'EndLight.dc.html'
};
}
}
</script>
</body>
</html>
