<link rel="manifest" href="manifest.webmanifest">

<body>
<x-dc>

</helmet>
<div class="dn" lang="{{lang}}" data-mode="dark" data-accent="{{accent}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--background-primary); color: var(--text-primary); display: flex; flex-direction: column; gap: 40px; padding: 56px 20px 40px 20px">

<div style="width: 236px; height: 37px; box-sizing: border-box; border-radius: 9999px; background: var(--static-black); display: flex; align-items: center; justify-content: space-between; padding: 0 16px">

</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">

<div style="border-radius: 44px; background: var(--static-black); padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">

</div>
<span style="font-size: 34px; line-height: 1; font-weight: 300; color: var(--accent); font-variant-numeric: tabular-nums">12:40</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">

<div style="font-size: 13px; line-height: 18px; color: var(--text-secondary)">{{t.endsAt}}</div>
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<div lang="en" style="font-size: 13px; line-height: 18px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-secondary)">Lock Screen (all iPhones)</div>
<div style="border-radius: 22px; background: var(--background-tertiary); padding: 16px; display: flex; flex-direction: column; gap: 12px">

<span style="font-size: 13px; line-height: 18px; color: var(--text-secondary)">{{t.purpose}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0">
<span style="font-size: 34px; line-height: 1; font-weight: 300; font-variant-numeric: tabular-nums">12:40</span>
<span style="font-size: 13px; line-height: 18px; color: var(--text-secondary)">{{t.leftEnds}}</span>

</div>
<div aria-hidden="true" style="height: 4px; border-radius: 9999px; background: var(--fill); display: flex"><div style="width: 16%; border-radius: 9999px; background: var(--accent)"></div></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["en","hy","ru"],"default":"en"},"accent":{"editor":"enum","options":["orange","teal","lavender","rose"],"default":"orange"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
/* Strings from the Do Nothing translations table. Generated, edit the table instead. */
dnT(k, v){ const T = {"app_name":{"en":"Do Nothing","hy":"Do Nothing","ru":"Do Nothing"},"la_ends_at":{"en":"Ends at {time}","hy":"Ավարտ՝ {time}","ru":"Закончится в {time}"},"purpose_coffee":{"en":"Coffee or a quiet moment","hy":"Սուրճ կամ լռություն","ru":"Кофе или минутка тишины"},"unit_minute_few":{"en":"{n} minutes","hy":"{n} րոպե","ru":"{n} минуты"},"unit_minute_many":{"en":"{n} minutes","hy":"{n} րոպե","ru":"{n} минут"},"unit_minute_one":{"en":"{n} minute","hy":"{n} րոպե","ru":"{n} минута"},"w_left_ends":{"en":"left · ends {time}","hy":"մնաց · ավարտ՝ {time}","ru":"осталось · до {time}"}}; const L = this.props.lang || 'en'; const e = T[k] || {}; let s = e[L] || e.en || k; if (v) for (const x in v) s = s.split('{' + x + '}').join(v[x]); return s; }
dnMin(n){ const L = this.props.lang || 'en'; let f = n === 1 ? 'one' : 'many'; try { const c = new Intl.PluralRules(L).select(n); f = c === 'one' ? 'one' : (c === 'few' ? 'few' : 'many'); } catch (e) {} return this.dnT('unit_minute_' + f, { n: n }); }
renderVals() {
const T = (k, v) => this.dnT(k, v);
return {
lang: this.props.lang || 'en',
accent: this.props.accent || 'orange',
t: { app: T('app_name'), purpose: T('purpose_coffee'), endsAt: T('la_ends_at', { time: '19:30' }), leftEnds: T('w_left_ends', { time: '19:30' }) }
};
}
}
</script>
</body>
</html>
