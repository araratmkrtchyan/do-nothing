<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Do Nothing — Session</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E0908">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="offline/icon-180.png">
<link rel="stylesheet" href="offline/fit.css">
<script src="offline/fit.js"></script>
<script src="offline/resources.js"></script>
<script src="offline/support.js"></script>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@keyframes dnBreathe{0%,100%{transform:scale(0.75);opacity:0.06}50%{transform:scale(1.08);opacity:0.15}}
@keyframes dnRipple{0%{transform:scale(0.5);opacity:0.45}100%{transform:scale(1.75);opacity:0}}
@keyframes dnFade{0%,100%{opacity:0.08}50%{opacity:0.14}}
.dn-glow{animation:dnBreathe 8s ease-in-out infinite}
.dn-ripple{animation:dnRipple 8s ease-out infinite}
.dn-ripple2{animation:dnRipple 8s ease-out 4s infinite;opacity:0}
.dn-still{opacity:0.06;transform:scale(0.75)}
@media (prefers-reduced-motion: reduce){.dn-glow{animation:dnFade 8s ease-in-out infinite;transform:scale(0.9)}.dn-ripple,.dn-ripple2{animation:none;opacity:0}}
</style>
</helmet>
<div class="dn" data-style="{{dnStyle}}" data-purpose="{{dnPurpose}}" data-screen="session" lang="{{lang}}" data-mode="dark" data-accent="{{accent}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--session-background); color: var(--session-text); display: flex; flex-direction: column; align-items: center; padding: 76px 24px 40px 24px">
<div style="font-size: 15px; line-height: 20px">{{purposeLabel}}</div>
<div style="flex-grow: 1; width: 100%; position: relative; display: flex; align-items: center; justify-content: center">
<div aria-hidden="true" class="{{glowClass}}" style="position: absolute; width: 560px; height: 560px; border-radius: 9999px; background: var(--accent)"></div>
<sc-if value="{{running}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" class="dn-ripple" style="position: absolute; width: 560px; height: 560px; border-radius: 9999px; border: 1px solid var(--accent); box-sizing: border-box"></div>
<div aria-hidden="true" class="dn-ripple2" style="position: absolute; width: 560px; height: 560px; border-radius: 9999px; border: 1px solid var(--accent); box-sizing: border-box"></div>
</sc-if>
<div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px">
<div role="timer" aria-label="{{timerLabel}}" style="font-size: 72px; line-height: 1; font-weight: 200; font-variant-numeric: tabular-nums; color: {{timeColor}}">{{clock}}</div>
<div style="font-size: 15px; line-height: 20px">{{stateWord}}</div>
<button onClick="{{toggle}}" aria-label="{{pauseLabel}}" style="margin-top: 24px; height: 48px; padding: 0 24px; border-radius: 9999px; border: 1px solid var(--session-control-border); background: var(--session-control-background); color: var(--session-control-text); font-family: inherit; font-size: 15px; line-height: 20px; display: flex; align-items: center; gap: 8px; cursor: pointer">
<sc-if value="{{running}}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"></rect><rect x="14" y="5" width="4" height="14" rx="1.5"></rect></svg>
</sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"></path></svg>
</sc-if>
<span>{{pauseText}}</span>
</button>
</div>
</div>
<p style="position: relative; margin: 0 0 24px 0; font-size: 15px; line-height: 20px; text-align: center; max-width: 290px">{{note}}</p>
<button onPointerDown="{{holdStart}}" onPointerUp="{{holdStop}}" onPointerLeave="{{holdStop}}" onPointerCancel="{{holdStop}}" onContextMenu="{{noMenu}}" aria-hidden="true" tabindex="-1" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; background: transparent; border: 0; padding: 0; cursor: pointer; color: var(--session-text); font-family: inherit; touch-action: none; user-select: none; -webkit-user-select: none">
<span style="font-size: 15px; line-height: 20px">{{holdText}}</span>
<span style="position: relative; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center">
<svg width="200" height="200" viewBox="0 0 200 200" style="position: absolute; left: 0; top: 0; transform: rotate(90deg)"><circle cx="100" cy="100" r="96" fill="none" stroke-width="4" style="stroke: var(--session-control-border)"></circle><circle cx="100" cy="100" r="96" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="603.2" stroke-dashoffset="{{holdOffset}}" style="stroke: var(--accent)"></circle></svg>
<span style="position: absolute; width: 76px; height: 76px; border-radius: 9999px; box-sizing: border-box; border: 1px solid var(--session-control-border); background: var(--session-control-background)"></span>
<span style="{{holdFill}}"></span>
</span>
</button>
<button class="sr-only" onClick="{{endNow}}">{{endA11y}}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["default","warm","lime","aqua"],"default":"warm"},"accent":{"editor":"enum","options":["orange","teal","lavender","rose"],"default":"orange"},"lang":{"editor":"enum","options":["en","hy","ru"],"default":"en"},"purpose":{"editor":"enum","options":["relax","reload","think","coffee","pause"],"default":"coffee"},"paused":{"editor":"boolean","default":false},"notificationsOff":{"editor":"boolean","default":false},"fast":{"editor":"boolean","default":false},"dark":{"editor":null},"go":{"editor":null},"mins":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.total = (p.mins ? p.mins * 60 : 1122) * 1000; this.state = { paused: null, left: this.total, hold: 0 }; }
speed(){ return this.props.fast ? 60 : 1; }
/* Strings from the Do Nothing translations table. Generated, edit the table instead. */
dnT(k, v){ const T = {"purpose_coffee":{"en":"Coffee or a quiet moment","hy":"Սուրճ կամ լռություն","ru":"Кофе или минутка тишины"},"purpose_pause":{"en":"A pause","hy":"Դադար","ru":"Пауза"},"purpose_relax":{"en":"Relax","hy":"Հանգստանալ","ru":"Отдохнуть"},"purpose_reload":{"en":"Reload","hy":"Լիցքավորվել","ru":"Перезагрузиться"},"purpose_think":{"en":"Stop overthinking","hy":"Բաց թողնել մտքերը","ru":"Отпустить мысли"},"session_end_a11y":{"en":"End the session","hy":"Ավարտել սեանսը","ru":"Завершить сеанс"},"session_ended":{"en":"Ended","hy":"Ավարտված է","ru":"Завершено"},"session_hold":{"en":"Hold to end","hy":"Պահիր՝ ավարտելու համար","ru":"Удерживай, чтобы закончить"},"session_holding":{"en":"Keep holding…","hy":"Շարունակիր պահել…","ru":"Держи ещё…"},"session_left":{"en":"left","hy":"մնաց","ru":"осталось"},"session_note":{"en":"You can close the app. We’ll let you know when it’s time.","hy":"Կարող ես փակել հավելվածը։ Կտեղեկացնենք, երբ ժամանակը գա։","ru":"Приложение можно закрыть. Мы дадим знать, когда пора."},"session_note_off":{"en":"Notifications are off, so keep the app open to see when it’s time.","hy":"Ծանուցումներն անջատված են, ուստի պահիր հավելվածը բաց, որ տեսնես, երբ ժամանակը գա։","ru":"Уведомления выключены, так что держи приложение открытым, чтобы увидеть, когда пора."},"session_note_paused":{"en":"Paused. Your {mins} wait here until you’re back.","hy":"Դադարեցված է։ Քո {mins}ն այստեղ կսպասի, մինչև վերադառնաս։","ru":"На паузе. Оставшиеся минуты подождут здесь, пока ты не вернёшься."},"session_pause":{"en":"Pause","hy":"Դադարեցնել","ru":"Пауза"},"session_pause_a11y":{"en":"Pause the session","hy":"Դադարեցնել սեանսը","ru":"Приостановить сеанс"},"session_paused":{"en":"paused","hy":"դադարեցված","ru":"на паузе"},"session_resume":{"en":"Resume","hy":"Շարունակել","ru":"Продолжить"},"session_resume_a11y":{"en":"Resume the session","hy":"Շարունակել սեանսը","ru":"Продолжить сеанс"},"session_timer":{"en":"{mins} left","hy":"Մնաց {mins}","ru":"Ещё {mins}"},"session_timer_paused":{"en":"Paused with {mins} left","hy":"Դադարեցված է, մնաց {mins}","ru":"На паузе, ещё {mins}"},"unit_minute_few":{"en":"{n} minutes","hy":"{n} րոպե","ru":"{n} минуты"},"unit_minute_many":{"en":"{n} minutes","hy":"{n} րոպե","ru":"{n} минут"},"unit_minute_one":{"en":"{n} minute","hy":"{n} րոպե","ru":"{n} минута"}}; const L = this.props.lang || 'en'; const e = T[k] || {}; let s = e[L] || e.en || k; if (v) for (const x in v) s = s.split('{' + x + '}').join(v[x]); return s; }
dnMin(n){ const L = this.props.lang || 'en'; let f = n === 1 ? 'one' : 'many'; try { const c = new Intl.PluralRules(L).select(n); f = c === 'one' ? 'one' : (c === 'few' ? 'few' : 'many'); } catch (e) {} return this.dnT('unit_minute_' + f, { n: n }); }
isPaused(){ return this.state.paused === null ? !!this.props.paused : this.state.paused; }
componentDidMount(){
if (!this.isPaused()) this.endAt = Date.now() + this.state.left / this.speed();
this.iv = setInterval(() => {
if (this.done || this.isPaused() || !this.endAt) return;
const left = Math.max(0, (this.endAt - Date.now()) * this.speed());
this.setState({ left });
if (left === 0) { this.done = true; clearInterval(this.iv); if (this.props.go) this.props.go('end'); }
}, 250);
}
componentWillUnmount(){ clearInterval(this.iv); clearInterval(this.hiv); }
togglePause(paused){
if (paused) { this.endAt = Date.now() + this.state.left / this.speed(); this.setState({ paused: false }); }
else { const left = this.endAt ? Math.max(0, (this.endAt - Date.now()) * this.speed()) : this.state.left; this.endAt = null; this.setState({ paused: true, left }); }
}
holdStart(e){
if (e && e.preventDefault) e.preventDefault();
if (this.done || this.hiv) return;
this.holdT0 = Date.now();
this.hiv = setInterval(() => {
const p = Math.min(1, (Date.now() - this.holdT0) / 1500);
this.setState({ hold: p });
if (p >= 1) { clearInterval(this.hiv); this.hiv = null; this.finishEarly(); }
}, 30);
}
holdStop(){
if (this.hiv) { clearInterval(this.hiv); this.hiv = null; }
if (this.state.hold < 1) this.setState({ hold: 0 });
}
finishEarly(){
let left = this.state.left;
if (this.endAt && !this.isPaused()) left = Math.max(0, (this.endAt - Date.now()) * this.speed());
const elapsed = Math.max(1, Math.round((this.total - left) / 60000));
this.done = true;
clearInterval(this.iv);
if (this.props.go) this.props.go('endEarly', elapsed); else this.setState({ ended: true });
}
renderVals() {
const paused = this.isPaused();
const hp = this.state.hold;
const secs = Math.ceil(this.state.left / 1000);
const m = Math.max(1, Math.ceil(secs / 60));
const T = (k, v) => this.dnT(k, v);
const mw = this.dnMin(m);
const labels = { relax: 'purpose_relax', reload: 'purpose_reload', think: 'purpose_think', coffee: 'purpose_coffee', pause: 'purpose_pause' };
return { dnStyle: this.props.variant || 'warm', dnPurpose: this.props.purpose || 'coffee',
lang: this.props.lang || 'en',
endA11y: T('session_end_a11y'),
accent: this.props.accent || 'orange',
purposeLabel: T(labels[this.props.purpose] || 'purpose_coffee'),
clock: Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0'),
running: !paused,
paused,
glowClass: paused ? 'dn-still' : 'dn-glow',
timeColor: paused ? 'var(--session-time-paused)' : 'var(--session-time)',
stateWord: paused ? T('session_paused') : T('session_left'),
timerLabel: paused ? T('session_timer_paused', { mins: mw }) : T('session_timer', { mins: mw }),
note: paused ? T('session_note_paused', { mins: mw }) : (this.props.notificationsOff ? T('session_note_off') : T('session_note')),
pauseText: paused ? T('session_resume') : T('session_pause'),
pauseLabel: paused ? T('session_resume_a11y') : T('session_pause_a11y'),
toggle: () => this.togglePause(paused),
holdStart: (e) => this.holdStart(e),
holdStop: () => this.holdStop(),
noMenu: (e) => { if (e && e.preventDefault) e.preventDefault(); },
endNow: () => this.finishEarly(),
holdOffset: String(603.2 * (1 - hp)),
holdFill: 'position: relative; width: 76px; height: 76px; border-radius: 9999px; background: var(--accent); transform: scale(' + hp + '); opacity: ' + (hp > 0 ? 1 : 0),
holdText: this.state.ended ? T('session_ended') : (hp > 0 ? T('session_holding') : T('session_hold'))
};
}
}
</script>
</body>
</html>
